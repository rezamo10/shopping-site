	<div class="max-w-100 mx-auto px-4">
		<div class="w-full flex flex-col gap-5 border border-neutral-200 p-5 md:p-10 rounded-[20px] shadow-md">
			<div class="w-full text-center">
				<h2 class="font-PoppinsMedium text-lg">Sign in to Account</h2>
			</div>
			<div class="flex flex-col gap-5">
				<form class="w-full">
					<label for="email" class="pl-3">Email Address</label><br>
					<div class="relative mt-2 mb-3">
						<span class="absolute inset-y-0 left-0 flex items-center pl-3">
							<svg class="w-6 h-6">
								<use href="#mail-icon"></use>
							</svg>
						</span>
						<input class="w-full border border-neutral-200 rounded-lg p-2.5 pl-11 shadow-xs outline-none" type="email" name="email" id="email" placeholder="Email Address" required><br>
					</div>
					<label for="password" class="pl-3">Password</label><br>
					<div class="relative mt-2 overflow-hidden rounded-lg">
						<span class="absolute inset-y-0 left-0 flex items-center pl-3">
							<svg class="w-6 h-6">
								<use href="#lock-icon"></use>
							</svg>
						</span>
						<input class="w-full border border-neutral-200 rounded-lg p-2.5 px-11 shadow-xs outline-none" type="password" name="password" id="password" placeholder="******" required>
						<button id="show-password-btn" class="absolute inset-y-0 right-0 flex items-center pr-3">
							<svg id="eye-icon" class="w-6 h-6 hidden">
								<use href="#open-eye-icon"></use>
							</svg>
							<svg id="eye-off-icon" class="w-6 h-6">
								<use href="#closed-eye-icon"></use>
							</svg>
						</button>
					</div>
				</form>
				<div class="flex items-center justify-between font-PoppinsSemiBold text-xs">
					<label for="remember-me" class="flex items-center gap-x-3 select-none cursor-pointer">
						<input type="checkbox" id="remember-me" class="appearance-none w-5 h-5 border border-[#E6E6E6] rounded shadow-sm
                        checked:bg-blue-500 checked:border-blue-500">
						<span>Remember Me</span>
					</label>
					<a href="#" class="text-blue-600">Forgot password?</a>
				</div>
				<button class="w-full rounded-lg outline-none border-none py-3 bg-black text-white cursor-pointer">Sign In</button>
			</div>
			<div class="text-sm font-PoppinsMedium flex items-center justify-center gap-x-2">
				<span class="text-neutral-500">Not a member?</span>
				<a href="register.html" class="text-blue-600">Create Account</a>
			</div>
			<div class="flex items-center">
				<span class="h-px bg-neutral-200 grow"></span>
				<span class="px-5 shrink-0 font-PoppinsSemiBold text-xs">OR</span>
				<span class="h-px bg-neutral-200 grow"></span>
			</div>
			<div class="flex flex-col gap-3 font-PoppinsMedium text-sm">
				<a href="" class="flex items-center justify-center gap-x-1 border py-2.5 border-neutral-200 rounded-lg shadow-xs">
					<svg class="w-6 h-6">
						<use href="#google-icon"></use>
					</svg>
					<span>Sign In with Google</span>
				</a>
				<a href="" class="flex items-center justify-center gap-x-1 border py-2.5 border-neutral-200 rounded-lg shadow-xs">
					<svg class="w-6 h-6">
						<use href="#facebook-icon"></use>
					</svg>
					<span>Continue with Facebook</span>
				</a>
				<a href="" class="flex items-center justify-center gap-x-1 border py-2.5 border-neutral-200 rounded-lg shadow-xs">
					<svg class="w-6 h-6">
						<use href="#apple-icon"></use>
					</svg>
					<span>Continue with Apple</span>
				</a>
			</div>
		</div>
	</div>
	<script src="./src/js/login.js" type="module"></script>
