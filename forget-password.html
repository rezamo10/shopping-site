<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
	<link rel="stylesheet" href="./src/style.css">
</head>
<body class="font-Poppins h-dvh flex items-center justify-center">
	<svg class="hidden">
		<symbol id="mail-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
			<path fill-rule="evenodd" clip-rule="evenodd" d="M18.4 5.60001H5.6C4.72 5.60001 4 6.32001 4 7.20001V16.8C4 17.68 4.72 18.4 5.6 18.4H18.4C19.28 18.4 20 17.68 20 16.8V7.20001C20 6.32001 19.28 5.60001 18.4 5.60001ZM18.08 9.00001L12.848 12.272C12.328 12.6 11.672 12.6 11.152 12.272L5.92 9.00001C5.72 8.87201 5.6 8.65601 5.6 8.42401C5.6 7.88801 6.184 7.56801 6.64 7.84801L12 11.2L17.36 7.84801C17.816 7.56801 18.4 7.88801 18.4 8.42401C18.4 8.65601 18.28 8.87201 18.08 9.00001Z" fill="#808080"/>
		</symbol>
		<symbol id="lock-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
			<path fill-rule="evenodd" clip-rule="evenodd" d="M12 13.6C11.12 13.6 10.4 14.32 10.4 15.2C10.4 16.08 11.12 16.8 12 16.8C12.88 16.8 13.6 16.08 13.6 15.2C13.6 14.32 12.88 13.6 12 13.6ZM16.8 9.6H16V8C16 5.792 14.208 4 12 4C10.176 4 8.58398 5.232 8.12798 7C8.01598 7.432 8.27198 7.864 8.70398 7.976C9.12798 8.088 9.56798 7.832 9.67998 7.4C9.95198 6.344 10.904 5.6 12 5.6C13.32 5.6 14.4 6.68 14.4 8V9.6H7.19998C6.31998 9.6 5.59998 10.32 5.59998 11.2V19.2C5.59998 20.08 6.31998 20.8 7.19998 20.8H16.8C17.68 20.8 18.4 20.08 18.4 19.2V11.2C18.4 10.32 17.68 9.6 16.8 9.6ZM16.8 18.4C16.8 18.84 16.44 19.2 16 19.2H7.99998C7.55998 19.2 7.19998 18.84 7.19998 18.4V12C7.19998 11.56 7.55998 11.2 7.99998 11.2H16C16.44 11.2 16.8 11.56 16.8 12V18.4Z" fill="#808080"/>
		</symbol>
	</svg>
	<div class="max-w-100 mx-auto px-4">
		<div class="flex flex-col gap-5 border border-neutral-200 p-5 md:p-10 rounded-[20px] shadow-md">
			<div class="p-1 shadow mx-auto rounded-4xl flex items-center justify-center gap-2 mb-2">
				<span class="fg-password active" data-page="1"></span>
				<span class="fg-password " data-page="2"></span>
			</div>
			<div class="overflow-hidden">
				<div id="slider" class="flex transition-transform duration-500 ease-in-out" style="width: 200%;">
					<div class="w-1/2 shrink-0 px-1 flex flex-col gap-5">
						<div class="w-full text-center flex flex-col gap-5 mb-4">
							<div class="w-10 h-10 mx-auto border border-neutral-200 rounded-full p-2 shadow flex items-center justify-center">
								<svg class="w-6 h-6"><use href="#lock-icon"></use></svg>
							</div>
							<h2 class="font-PoppinsMedium text-lg">Forgot Password?</h2>
							<span class="text-blue-600 text-xs font-PoppinsSemiBold">Leave your email and we will send you a link</span>
						</div>
						<div class="flex flex-col gap-5">
							<form class="w-full">
								<label for="email" class="pl-3 text-sm">Email Address</label><br>
								<div class="relative mt-2">
                         <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                            <svg class="w-6 h-6"><use href="#mail-icon"></use></svg>
                         </span>
									<input class="w-full border border-neutral-200 rounded-lg p-2.5 pl-11 shadow-xs outline-none text-xs" type="email" name="email" id="email" placeholder="Email Address" required><br>
								</div>
							</form>
							<button type="button" id="confirmBtn" disabled class="w-full rounded-lg outline-none border-none py-3 bg-blue-600 text-white cursor-not-allowed opacity-50">Confirm</button>
						</div>
					</div>
					<div class="w-1/2 shrink-0 px-1 flex flex-col gap-5">
						<div class="w-full text-center flex flex-col gap-5 mb-4">
							<div class="w-10 h-10 mx-auto border border-neutral-200 rounded-full p-2 shadow flex items-center justify-center">
								<svg class="w-6 h-6"><use href="#mail-icon"></use></svg>
							</div>
							<h2 class="font-PoppinsMedium text-lg">Check Your Email</h2>
							<span class="text-blue-600 text-xs font-PoppinsSemiBold">We sent a password reset link</span>
						</div>
						<div class="flex flex-col gap-5">
							<button type="button" id="openEmailBtn" class="w-full rounded-lg outline-none border-none py-3 bg-blue-600 text-white cursor-pointer">Open Email App</button>
							<div class="text-center text-xs text-neutral-500">
								Didn't receive a Link?
								<span id="timer" class="text-blue-600"></span>
								<button type="button" id="resendBtn" class="text-blue-600 font-PoppinsSemiBold cursor-pointer bg-transparent border-none hidden">Resend</button>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="w-full text-center mt-5">
				<a href="login.html" class="text-blue-600 font-PoppinsSemiBold text-sm">Back to Log In</a>
			</div>
		</div>
	</div>
	<script src="./src/js/forget-password.js" type="module"></script>
</body>
</html>
